<body>
  <div id="root"></div>
  <script>
    // Initialize minimal frappe globals for static deployment
    if (!window.frappe) window.frappe = {};
    if (!window.frappe.boot) {
      window.frappe.boot = {
        sitename: '',
        layout_direction: 'ltr',
        desk_theme: 'Automatic',
        lang: 'en',
        user: { name: 'Administrator' },
        docs: []
      };
    }
    if (!window.frappe.model) {
      window.frappe.model = {
        sync: function() {}
      };
    }
    if (!window.frappe._messages) {
      window.frappe._messages = {};
    }
    window.frappe._translations_loaded = Promise.resolve();
    window.csrf_token = 'static';
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
